# Include inside the existing fototausch.eu HTTPS server block.
# Reader-only snapshot generated by tools/export_server_library.exs.
location ^~ /ga-reader/ {
    root /var/lib/ga-reader/current;
    rewrite ^/ga-reader/(.*)$ /$1 break;
    try_files $uri $uri/index.json =404;
    index index.json;
    default_type application/json;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}
