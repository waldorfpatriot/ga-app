# Include inside the existing HTTPS server block; no other Phoenix routes exposed.
# Adjust the loopback port to match PORT in the service environment.
location ^~ /rudolf-steiner-ga/api/access/ {
    proxy_pass http://127.0.0.1:4131/api/access/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    client_max_body_size 64k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_cache off;
    add_header X-Content-Type-Options nosniff always;
}

# Exact public health route for the isolated GA access service.
location = /rudolf-steiner-ga/api/health {
    proxy_pass http://127.0.0.1:4131/api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

# Compatibility alias for already-configured builds during migration.
location ^~ /ga-access/api/access/ {
    proxy_pass http://127.0.0.1:4131/api/access/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    client_max_body_size 64k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_cache off;
    add_header X-Content-Type-Options nosniff always;
    # Default nginx access logs contain neither bodies nor Authorization headers.
}

location = /ga-access/api/access {
    return 404;
}

location /ga-access/ {
    return 404;
}
