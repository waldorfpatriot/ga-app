# Include in the existing fototausch.eu HTTPS server.
location = /rudolf-steiner-ga {
    return 301 /rudolf-steiner-ga/;
}

location = /rudolf-steiner-ga/ {
    root /var/www;
    try_files /rudolf-steiner-ga/index.html =404;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=3600";
}

location = /rudolf-steiner-ga/privacy.html {
    root /var/www;
    try_files $uri =404;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=3600";
}

location = /rudolf-steiner-ga/support.html {
    root /var/www;
    try_files $uri =404;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=3600";
}
